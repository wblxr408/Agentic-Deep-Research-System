schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Core philosophy: docs/DESIGN_PRINCIPLES.md is the canonical project guidance.
  Prefer the minimum useful agent/tool structure and justify additional abstraction.
  Make user-facing plans, execution status, plan changes and evidence explicit.
  Document ACI purpose, inputs/outputs, permissions, limits, errors and recovery.
  Frameworks are implementation choices; production may reduce unnecessary layers.
  Respect the user's regression-test prohibition. Prose-only changes use content review.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
